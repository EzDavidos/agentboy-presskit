<!doctype html>
<!-- Source for assets/img/og.jpg — the link preview card (1200x630).
     Rebuild after changing the hero photo or the tagline:
       python3 -m http.server 8899
       then screenshot http://localhost:8899/tools/og-card.html at 1200x630
     A vertical photo cannot be used directly: Telegram and WhatsApp crop
     previews to landscape and cut the face out. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#0a0a0c;color:#f4f4f6;font-family:Inter,sans-serif;display:flex}
.art{position:relative;width:470px;height:630px;flex:none}
.art img{width:100%;height:100%;object-fit:cover;object-position:center 24%}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,12,0) 45%,#0a0a0c 100%)}
.side{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 70px 0 30px;position:relative}
.glow{position:absolute;width:700px;height:700px;right:-220px;top:-160px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,31,61,.30),transparent 66%);filter:blur(50px)}
.role{position:relative;font-size:22px;letter-spacing:9px;text-transform:uppercase;color:#9a9aa5;margin-bottom:14px}
.name{position:relative;font-family:Oswald,sans-serif;font-weight:700;font-size:124px;line-height:.92;letter-spacing:2px;text-transform:uppercase}
.name span{color:#ff1f3d}
.tag{position:relative;margin-top:14px;font-size:24px;letter-spacing:7px;text-transform:uppercase;color:#ff445e}
.meta{position:relative;margin-top:40px;display:flex;gap:10px;flex-wrap:wrap}
.meta i{font-style:normal;font-size:19px;letter-spacing:1.4px;text-transform:uppercase;color:#f4f4f6;
        border:1px solid #2a2a31;background:rgba(22,22,26,.7);padding:9px 16px;border-radius:999px}
</style></head><body>
<div class="art"><img src="../assets/img/hero.jpg"></div>
<div class="side">
  <div class="glow"></div>
  <p class="role">DJ / Producer</p>
  <h1 class="name">AGENT<span>BOY</span></h1>
  <p class="tag">dreams come true</p>
  <div class="meta"><i>Progressive house</i><i>Melodic techno</i><i>Asia-based</i></div>
</div>
</body></html>
